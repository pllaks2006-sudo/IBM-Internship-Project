<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Learning Assistant</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f4f7fb;
            padding: 50px;
        }

        .card {
            max-width: 700px;
            margin: auto;
            background: white;
            padding: 35px;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        h1 {
            color: #4f46e5;
            text-align: center;
            margin-bottom: 25px;
        }

        h2 {
            color: #3730a3;
            margin-top: 20px;
            margin-bottom: 15px;
        }

        .topic-box {
            background: #eef2ff;
            padding: 20px;
            border-radius: 10px;
            font-size: 18px;
        }

        ul {
            margin-left: 25px;
            margin-top: 15px;
        }

        li {
            margin-bottom: 15px;
            font-size: 17px;
        }

        button {
            background: #4f46e5;
            color: white;
            border: none;
            padding: 12px 25px;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            margin-top: 25px;
        }

        button:hover {
            background: #3730a3;
        }

        a {
            text-decoration: none;
        }

    </style>

</head>


<body>

    <div class="card">

        <h1>🧠 Learning Assistant</h1>

        <h2>Your Topic</h2>

        <div class="topic-box">

            {{ topic }}

        </div>


        <h2>📚 Learning Tips</h2>

        <ul>

            {% for tip in tips %}

                <li>{{ tip }}</li>

            {% endfor %}

        </ul>


        <a href="/">

            <button>🏠 Back to Home</button>

        </a>

    </div>

</body>

</html>
