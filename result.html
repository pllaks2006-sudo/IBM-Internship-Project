<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Quiz Result</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f4f7fb;
            padding: 30px;
        }

        .container {
            max-width: 700px;
            margin: auto;
        }

        .card {
            background: white;
            padding: 40px;
            border-radius: 15px;
            text-align: center;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        h1 {
            color: #4f46e5;
            font-size: 32px;
        }

        .score {
            font-size: 50px;
            font-weight: bold;
            margin: 30px 0;
            color: #4f46e5;
        }

        .message {
            font-size: 20px;
            margin-bottom: 25px;
        }

        .button {
            display: inline-block;
            background: #4f46e5;
            color: white;
            padding: 12px 25px;
            border-radius: 8px;
            text-decoration: none;
            margin: 10px;
        }

        .button:hover {
            background: #3730a3;
        }

    </style>

</head>

<body>

    <div class="container">

        <div class="card">

            <h1>🎉 Quiz Completed!</h1>

            <p>Your Final Score</p>

            <div class="score">

                {{ score }} / {{ total }}

            </div>


            {% if score == total %}

                <p class="message">
                    🏆 Excellent! Perfect Score!
                </p>

            {% elif score >= 2 %}

                <p class="message">
                    🎉 Good Job! Keep Learning!
                </p>

            {% else %}

                <p class="message">
                    📚 Keep Practicing! You Can Improve!
                </p>

            {% endif %}


            <a href="/quiz" class="button">

                Try Quiz Again 📝

            </a>


            <a href="/" class="button">

                Back to Home 🏠

            </a>

        </div>

    </div>

</body>

</html>
