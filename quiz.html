<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Quiz Generator</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f4f7fb;
            padding: 30px;
        }

        .container {
            max-width: 800px;
            margin: auto;
        }

        .card {
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        }

        h1 {
            text-align: center;
            color: #4f46e5;
            margin-bottom: 25px;
        }

        .question {
            background: #eef2ff;
            padding: 20px;
            margin-bottom: 20px;
            border-radius: 10px;
        }

        .question h3 {
            margin-bottom: 15px;
        }

        .option {
            margin: 12px 0;
        }

        input[type="radio"] {
            margin-right: 10px;
        }

        button {
            background: #4f46e5;
            color: white;
            border: none;
            padding: 12px 25px;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #3730a3;
        }

        .back {
            display: inline-block;
            margin-top: 20px;
            text-decoration: none;
            color: white;
            background: #4f46e5;
            padding: 12px 20px;
            border-radius: 8px;
        }

    </style>

</head>

<body>

    <div class="container">

        <div class="card">

            <h1>📝 Quiz Generator</h1>

            <form action="/submit-quiz" method="POST">

                {% for question in questions %}

                {% set question_number = loop.index0 %}

                <div class="question">

                    <h3>
                        {{ loop.index }}. {{ question.question }}
                    </h3>

                    {% for option in question.options %}

                    <div class="option">

                        <label>

                            <input
                                type="radio"
                                name="question{{ question_number }}"
                                value="{{ option[0] }}"
                                required
                            >

                            {{ option }}

                        </label>

                    </div>

                    {% endfor %}

                </div>

                {% endfor %}

                <button type="submit">
                    Submit Quiz 🎯
                </button>

            </form>

            <br>

            <a href="/" class="back">
                ← Back to Home
            </a>

        </div>

    </div>

</body>

</html>
